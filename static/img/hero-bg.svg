<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Degradados -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="hillGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- CIELO DESPEJADO -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- SOL SONRIENTE -->
  <g transform="translate(1450, 220)">
    <g opacity="0.5">
      <circle cx="0" cy="0" r="160" fill="url(#sunGlow)"/>
      <line x1="0" y1="-130" x2="0" y2="-170" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="92" y1="-92" x2="120" y2="-120" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="130" y1="0" x2="170" y2="0" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="92" y1="92" x2="120" y2="120" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="130" x2="0" y2="170" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="-92" y1="92" x2="-120" y2="120" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="-130" y1="0" x2="-170" y2="0" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
      <line x1="-92" y1="-92" x2="-120" y2="-120" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="0" r="85" fill="#FACC15"/>
    <circle cx="0" cy="0" r="78" fill="#FDE047"/>
    <ellipse cx="-26" cy="-10" rx="7" ry="11" fill="#1E293B"/>
    <circle cx="-23" cy="-14" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="26" cy="-10" rx="7" ry="11" fill="#1E293B"/>
    <circle cx="29" cy="-14" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="-38" cy="8" rx="11" ry="6" fill="#F87171" opacity="0.6"/>
    <ellipse cx="38" cy="8" rx="11" ry="6" fill="#F87171" opacity="0.6"/>
    <path d="M -22,10 Q 0,36 22,10" fill="none" stroke="#1E293B" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- COLINAS DEL FONDO -->
  <path d="M -100,680 Q 350,480 850,620 T 1850,540 Q 1980,520 2020,550 L 2020,1100 L -100,1100 Z" fill="url(#hillGrad1)"/>

  <!-- RÍO -->
  <path d="M 900,630 Q 820,720 880,820 T 650,1100 L 780,1100 Q 980,850 920,740 Q 940,680 950,630 Z" fill="url(#riverGrad)"/>

  <!-- COLINAS INTERMEDIAS -->
  <path d="M -50,780 Q 420,580 980,740 T 2000,650 L 2000,1100 L -50,1100 Z" fill="url(#hillGrad2)"/>

  <!-- CASITAS Y JUEGOS -->
  <g transform="translate(250, 620) scale(0.9)">
    <rect x="-35" y="-10" width="70" height="50" rx="4" fill="#FEF08A"/>
    <path d="M -45,-10 L 0,-45 L 45,-10 Z" fill="#F43F5E"/>
    <rect x="-10" y="10" width="20" height="30" rx="2" fill="#B45309"/>
    <rect x="-26" y="2" width="14" height="14" rx="2" fill="#38BDF8"/>
    <rect x="12" y="2" width="14" height="14" rx="2" fill="#38BDF8"/>
  </g>

  <!-- COLINA EN PRIMER PLANO Y DETALLES -->
  <path d="M -100,880 Q 550,720 1150,860 Q 1650,960 2020,790 L 2020,1100 L -100,1100 Z" fill="url(#hillGrad3)"/>

  <!-- CERCA DE MADERA -->
  <g transform="translate(800, 810)" fill="#D97706" stroke="#92400E" stroke-width="2">
    <rect x="0" y="20" width="260" height="10" rx="2"/>
    <rect x="0" y="45" width="260" height="10" rx="2"/>
    <path d="M 20,0 L 40,0 L 40,70 L 20,70 Z L 30,-10 Z"/>
    <path d="M 80,0 L 100,0 L 100,70 L 80,70 Z L 90,-10 Z"/>
    <path d="M 140,0 L 160,0 L 160,70 L 140,70 Z L 150,-10 Z"/>
    <path d="M 200,0 L 220,0 L 220,70 L 200,70 Z L 210,-10 Z"/>
  </g>
</svg>
