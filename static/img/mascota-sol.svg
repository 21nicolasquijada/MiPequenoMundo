<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rayos del Sol -->
  <g stroke="#FFB703" stroke-width="8" stroke-linecap="round">
    <line x1="100" y1="15" x2="100" y2="35" />
    <line x1="100" y1="165" x2="100" y2="185" />
    <line x1="15" y1="100" x2="35" y2="100" />
    <line x1="165" y1="100" x2="185" y2="100" />
    <line x1="40" y1="40" x2="54" y2="54" />
    <line x1="146" y1="146" x2="160" y2="160" />
    <line x1="40" y1="160" x2="54" y2="146" />
    <line x1="146" y1="54" x2="160" y2="40" />
  </g>

  <!-- Cuerpo del Sol -->
  <circle cx="100" cy="100" r="50" fill="#FFD166" />

  <!-- Ojos -->
  <circle cx="85" cy="90" r="5" fill="#2B2D42" />
  <circle cx="115" cy="90" r="5" fill="#2B2D42" />

  <!-- Mejillas -->
  <circle cx="77" cy="102" r="7" fill="#FF8FA3" opacity="0.6" />
  <circle cx="123" cy="102" r="7" fill="#FF8FA3" opacity="0.6" />

  <!-- Sonrisa -->
  <path d="M 85 108 A 15 15 0 0 0 115 108" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round" />
</svg>
